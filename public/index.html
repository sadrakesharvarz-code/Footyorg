<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FootyOrg</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">FootyOrg</div>

      <nav class="nav" id="homeNavLoggedOut">
        <a class="pill" href="/create">Become an organizer</a>
        <a class="btn primary" href="/login">Organizer login</a>
        <a class="pill" href="/player/login">Player login</a>
        <a class="pill" href="/player/create">Create player account</a>
      </nav>

      <nav class="nav" id="homeNavLoggedIn" style="display:none;">
        <a class="pill" href="/join">Join league</a>
        <a class="pill" id="dashboardLink" href="/organizer">Dashboard</a>
        <form id="logoutForm" method="POST" action="/logout" style="margin:0;">
          <button class="btn primary" type="submit">Log out</button>
        </form>
      </nav>
    </header>

    <main class="hero">
      <div>
        <h1>FootyOrg</h1>
        <p class="sub">Simple soccer league signup.</p>
        <div class="actions">
          <a class="btn" href="/join">Join a league</a>
          <a id="createLeagueBtn" class="btn primary" href="/create">Create a league</a>
        </div>
        <div class="small">Apple Pay-ready checkout can be connected in the backend.</div>
      </div>
    </main>
  </div>

  <script>
    async function updateHomeNav() {
      const loggedOutNav = document.getElementById('homeNavLoggedOut');
      const loggedInNav = document.getElementById('homeNavLoggedIn');

      if (!loggedOutNav || !loggedInNav) return;

      try {
        const res = await fetch('/auth/status', {
          method: 'GET',
          credentials: 'same-origin'
        });

        if (res.ok) {
          const data = await res.json();
          const dashboardLink = document.getElementById('dashboardLink');
          const createLeagueBtn = document.getElementById('createLeagueBtn');

          const logoutForm = document.getElementById('logoutForm');

          if (data?.player && !data?.organizer) {
            dashboardLink.href = '/player';
            dashboardLink.textContent = 'Player dashboard';
            if (logoutForm) logoutForm.action = '/player/logout';
            if (createLeagueBtn) createLeagueBtn.style.display = 'none';
          } else {
            dashboardLink.href = '/organizer';
            dashboardLink.textContent = 'Organizer dashboard';
            if (logoutForm) logoutForm.action = '/logout';
            if (createLeagueBtn) createLeagueBtn.style.display = 'inline-block';
          }
          loggedOutNav.style.display = 'none';
          loggedInNav.style.display = 'flex';
        } else {
          loggedOutNav.style.display = 'flex';
          loggedInNav.style.display = 'none';
        }
      } catch {
        loggedOutNav.style.display = 'flex';
        loggedInNav.style.display = 'none';
      }
    }

    updateHomeNav();
  </script>
</body>
</html>
