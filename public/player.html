<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Player Dashboard • FootyOrg</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="dashboard">
    <header class="top">
      <a class="brand" href="/">FootyOrg</a>
      <nav class="nav">
        <a class="pill" href="/join">Join league</a>
        <a class="pill" href="/player">Dashboard</a>
        <form method="POST" action="/player/logout" style="margin:0;">
          <button class="pill" type="submit">Log out</button>
        </form>
      </nav>
    </header>

    <section class="dashboard-header">
      <div>
        <h1>Player dashboard</h1>
        <p>Manage your league registrations and account details.</p>
      </div>
    </section>

    <div class="card">
      <div id="playerInfo">Loading player data...</div>

      <h2>Registrations</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>League</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="regsTable">
          <tr><td colspan="4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="/player.js"></script>
</body>
</html>
