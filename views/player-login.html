<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Login • FootyOrg</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/">FootyOrg</a>
      <nav class="nav">
        <a class="pill" href="/player/create">Create player account</a>
        <a class="pill" href="/login">Organizer login</a>
      </nav>
    </header>

    <main class="page">
      <div class="card">
        <h1>Player login</h1>
        <p>Sign in to view your registration dashboard.</p>

        <div id="authError" class="notice" style="display:none;"></div>

        <form class="form" method="POST" action="/player/login">
          <input id="email" name="email" type="email" placeholder="Email" required />
          <input id="password" name="password" type="password" placeholder="Password" required />
          <button class="btn primary" type="submit">Log in</button>
        </form>

        <p class="small">Need an account? <a href="/player/create">Create one</a>.</p>
      </div>
    </main>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    const errorBox = document.getElementById('authError');
    if (error) {
      errorBox.textContent = decodeURIComponent(error);
      errorBox.style.display = 'block';
    }
  </script>
</body>
</html>
