<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Become an organizer • FootyOrg</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/">FootyOrg</a>
      <nav class="nav">
        <a class="pill" href="/login">Log in</a>
        <a class="btn" href="/join">Join a league</a>
      </nav>
    </header>

    <main class="page">
      <div class="card">
        <h1>Become an organizer</h1>
        <p>Create your organizer account to start managing leagues and payouts.</p>

        <form class="form" method="POST" action="/organizer/signup">
          <input
            type="text"
            name="name"
            placeholder="Organizer or club name"
            required
          />

          <input
            type="email"
            name="email"
            placeholder="Email address"
            required
          />

          <input
            type="password"
            name="password"
            placeholder="Create a password (minimum 8 characters)"
            minlength="8"
            required
          />

          <button class="btn primary" type="submit">Create organizer account</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
