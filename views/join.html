<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join a league · FootyOrg</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    #joinNavLoggedOut,
    #joinNavLoggedIn {
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/">FootyOrg</a>

      <nav class="nav" id="joinNavLoggedOut" style="display:flex;">
        <a class="pill" href="/login">Log in</a>
        <a class="btn primary" href="/create">Create a league</a>
      </nav>

      <nav class="nav" id="joinNavLoggedIn" style="display:none;">
        <form id="joinLogoutForm" method="POST" action="/player/logout" style="margin:0;">
          <button class="btn primary" type="submit">Log out</button>
        </form>
      </nav>
    </header>

    <main class="page">
      <div class="card">
        <h1>Join a league</h1>
        <p>Fill in your details and you'll be sent to checkout.</p>

        <div class="notice" id="playerNotice" style="display:none;"></div>
        <div class="notice" id="leagueError" style="display:none; background:#fdecea; border-color:#f5c2c0; color:#611a15;"></div>

        <form class="form" method="POST" action="/checkout" id="joinForm">
          <input type="text" id="fullNameInput" name="fullName" placeholder="Full name" required />
          <input type="email" id="emailInput" name="email" placeholder="Email" required />
          <input type="tel" name="phone" placeholder="Phone" required />

          <select id="leagueId" name="leagueId" required>
            <option value="">Loading leagues...</option>
          </select>

          <select name="skillLevel" required>
            <option value="">Skill level</option>
            <option>Recreational</option>
            <option>Intermediate</option>
            <option>Competitive</option>
          </select>

          <label class="checkbox">
            <input type="checkbox" name="waiver" value="yes" required />
            <span>I agree to the league waiver and code of conduct.</span>
          </label>

          <button class="btn primary" type="submit">Continue to checkout</button>
        </form>
      </div>
    </main>

    <script src="/script.js"></script>
    <script>
      (async function checkPlayerSession() {
        const loggedOutNav = document.getElementById('joinNavLoggedOut');
        const loggedInNav = document.getElementById('joinNavLoggedIn');

        try {
          const res = await fetch('/auth/status', {
            method: 'GET',
            credentials: 'include'
          });

          if (res.ok) {
            const data = await res.json();

            if (data?.player) {
              const notice = document.getElementById('playerNotice');
              const fullNameInput = document.getElementById('fullNameInput');
              const emailInput = document.getElementById('emailInput');

              notice.textContent = `Signed in as ${data.player.full_name || data.player.email}. Your info is pre-filled below.`;
              notice.style.display = 'block';

              fullNameInput.value = data.player.full_name || '';
              emailInput.value = data.player.email || '';

              fullNameInput.readOnly = true;
              emailInput.readOnly = true;

              loggedOutNav.style.display = 'none';
              loggedInNav.style.display = 'flex';
            } else {
              loggedOutNav.style.display = 'flex';
              loggedInNav.style.display = 'none';
            }
          } else {
            loggedOutNav.style.display = 'flex';
            loggedInNav.style.display = 'none';
          }
        } catch {
          loggedOutNav.style.display = 'flex';
          loggedInNav.style.display = 'none';
        } finally {
          loggedOutNav.style.visibility = 'visible';
          loggedInNav.style.visibility = 'visible';
        }
      })();

      (async function loadLeagues() {
        const leagueSelect = document.getElementById('leagueId');
        const leagueError = document.getElementById('leagueError');

        try {
          const res = await fetch('/api/leagues', {
            method: 'GET',
            credentials: 'include'
          });

          if (!res.ok) throw new Error('Failed to load leagues');

          const data = await res.json();
          const leagues = data.leagues || [];

          leagueSelect.innerHTML = '';

          if (!leagues.length) {
            leagueSelect.innerHTML = '<option value="">No leagues available right now</option>';
            leagueSelect.disabled = true;
            return;
          }

          const placeholder = document.createElement('option');
          placeholder.value = '';
          placeholder.textContent = 'Select a league';
          leagueSelect.appendChild(placeholder);

          leagues.forEach((league) => {
            const option = document.createElement('option');
            option.value = league.slug;
            option.textContent = `${league.name} — ${league.organizer_name} — $${(league.price / 100).toFixed(2)}`;
            leagueSelect.appendChild(option);
          });
        } catch (err) {
          leagueSelect.innerHTML = '<option value="">Unable to load leagues</option>';
          leagueSelect.disabled = true;
          leagueError.textContent = 'We could not load available leagues right now. Please refresh or try again shortly.';
          leagueError.style.display = 'block';
        }
      })();
    </script>
  </div>
</body>
</html>
